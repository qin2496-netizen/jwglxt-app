distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 用本地已下载的 Gradle 分发包：本机网络对大文件下载不稳定，
# 已离线下载好 130MB 的 gradle-8.13-bin.zip。
# 从 file:// 读取可跳过重复下载，wrapper 会自行解压到 GRADLE_USER_HOME 下。
#
# 注意：路径刻意放在**纯 ASCII 目录**（jwglxt-build-tools）下。
# 因为本工程所在路径含中文（pdf工具），Java 的 file:// URL 解析中文会出错。
distributionUrl=file\:///D:/JA/pdf%E5%B7%A5%E5%85%B7/jwglxt-build-tools/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
