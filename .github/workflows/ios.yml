name: Build iOS App (IPA)

# =============================================================================
# 为什么需要这个工作流
# -----------------------------------------------------------------------------
# 编译 iOS 必须用 macOS + Xcode，而开发机是 Windows，
# Windows 上没有任何办法本地出 iOS 包（苹果的设计，不是缺工具）。
# GitHub Actions 提供免费的 macOS 运行器，可在云端完成构建。
#
# ⚠️ 关键：Capacitor 8 用 Swift Package Manager，不用 CocoaPods
# -----------------------------------------------------------------------------
# 实测（首次构建失败后查日志得知）：执行 `cap sync ios` 时输出
#     [info] All Capacitor plugins have a Package.swift file
#     [info] Writing Package.swift
# 也就是说 Capacitor 8 已全面转向 SPM，**不再生成 Podfile**。
# 因此：
#   - 不要执行 `pod install`（会报 "No Podfile found in the project directory"）
#   - 构建要用 App.xcodeproj（不是 App.xcworkspace —— 后者由 CocoaPods 生成）
#
# 本工作流做什么
# -----------------------------------------------------------------------------
#   1. 生成 iOS 原生工程（cap add ios）
#   2. 写入 ATS 例外 —— 站点是纯 HTTP，不配这个 iOS 会直接拒绝加载、白屏
#   3. 用 xcodebuild 构建（走 SPM 依赖解析）
#   4. 产出未签名 IPA 作为 artifact
#
# ⚠️ 关于产物的三个硬事实
# -----------------------------------------------------------------------------
#   1. 未签名 IPA 装不到 iPhone 上。要安装还需苹果签名，途径：
#        a) 免费 Apple ID + Sideloadly / AltStore 自签（7 天有效期）
#        b) 苹果开发者账号（$99/年）+ 证书与描述文件，有效期 1 年
#        c) 借一台 Mac 用 Xcode 直接 Run（免费 Apple ID 也能装，同样 7 天）
#   2. 苹果审核指南 4.2 规定「纯网页套壳的 App」会被拒，自用无妨，上架无望。
# =============================================================================

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - 'www/**'
      - 'assets/**'
      - 'capacitor.config*.ts'
      - 'scripts/prepare-ios.mjs'
      - 'scripts/make-icons.mjs'
      - 'package.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch: # 支持在 Actions 页面手动触发

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 构建 iOS（未签名 IPA）
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 不要加 --ignore-scripts：Capacitor 的部分依赖靠 postinstall 准备文件
      - name: 安装项目依赖
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 检查 plist 补丁逻辑（快速失败）
        run: node scripts/test-ios-plist.mjs

      # 生成 ios/ 目录并写入 ATS 例外（站点是 HTTP，必需）
      - name: 准备 iOS 工程（cap add ios + ATS 例外 + 图标）
        run: node scripts/prepare-ios.mjs

      - name: 同步网页资源到 iOS 工程（SPM 依赖在此解析）
        run: npx cap sync ios

      - name: 确认工程类型（SPM 用 xcodeproj，CocoaPods 才有 xcworkspace）
        working-directory: ios/App
        run: |
          echo "--- ios/App 目录内容 ---"
          ls -la
          if [ -f Podfile ]; then
            echo "→ 检测到 Podfile（CocoaPods 工程）"
          else
            echo "→ 无 Podfile（Capacitor 8 的 SPM 工程，直接用 xcodeproj）"
          fi

      # 兼容分支：万一某个 Capacitor 版本仍在用 CocoaPods。
      # 注意：条件直接判断文件是否存在，不用 env 变量 ——
      # GitHub 的 if 条件在工作流解析阶段求值，读不到上一步运行时写入 GITHUB_ENV 的值。
      - name: 安装 CocoaPods 依赖（仅当存在 Podfile）
        working-directory: ios/App
        run: |
          if [ -f Podfile ]; then
            gem install cocoapods --no-document
            pod install
            ls -la App.xcworkspace
          else
            echo "无 Podfile，跳过（Capacitor 8 使用 SPM）"
          fi

      - name: 查看可用的 scheme 与 SDK
        working-directory: ios/App
        run: |
          xcodebuild -list -project App.xcodeproj || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      # 构建（未签名）。走 SPM 时用 -project；若存在 Podfile 则用 -workspace。
      - name: 构建（未签名 archive）
        working-directory: ios/App
        run: |
          set -o pipefail

          if [ -f Podfile ]; then
            TARGET_FLAG="-workspace App.xcworkspace"
          else
            TARGET_FLAG="-project App.xcodeproj"
          fi

          echo "使用：xcodebuild $TARGET_FLAG"
          echo "=== 开始构建 ==="

          # 不用管道（如 xcpretty）以免掩盖退出码；
          # 输出写文件，失败时打印尾部关键信息。
          if xcodebuild $TARGET_FLAG \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              -skipPackagePluginValidation \
              archive > /tmp/xcodebuild.log 2>&1; then
            echo "✓ 构建成功"
            grep -E "BUILD SUCCEEDED|Resolve Package|Fetching" /tmp/xcodebuild.log | tail -20 || true
          else
            echo "✗ 构建失败，错误摘要："
            grep -E "error:|❌|BUILD FAILED|The following build commands failed" /tmp/xcodebuild.log | tail -40 || true
            echo ""
            echo "--- 日志末尾 80 行 ---"
            tail -80 /tmp/xcodebuild.log
            exit 1
          fi

      - name: 打包为未签名 IPA
        run: |
          APP_PATH="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "找不到构建产物：$APP_PATH"
            ls -R "$RUNNER_TEMP/App.xcarchive/Products" 2>/dev/null || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry jwglxt-unsigned.ipa Payload
          ls -lh jwglxt-unsigned.ipa

      # 校验：把 ATS 配置从产物里读出来，确认没漏（漏了装上去就是白屏）
      - name: 校验产物里的 ATS 配置
        run: |
          PLIST="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist"
          echo "--- ATS 例外 ---"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST" \
            || { echo "✗ 产物里没有 ATS 例外，装上去会白屏"; exit 1; }
          echo "--- 应用名 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" || true
          echo "--- 包标识 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" || true

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/jwglxt-unsigned.ipa
          retention-days: 30

      - name: 保存构建日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            /tmp/xcodebuild.log
            /tmp/pod.log
          retention-days: 7
          if-no-files-found: ignore
